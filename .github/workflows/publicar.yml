name: Publicar Ofertas Automaticas

permissions:
  contents: write

on:
  workflow_dispatch:

  schedule:
    # 12:30 Argentina = 15:30 UTC
    - cron: '30 15 * * *'

    # 20:30 Argentina = 23:30 UTC
    - cron: '30 23 * * *'

concurrency:
  group: publicar-ofertas-automaticas
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow

      - name: Ejecutar Bot de Ofertas
        run: |
          python main.py

      - name: Guardar tanda, datos e imágenes en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ultima_tanda.txt
          git add datos_tanda.txt
          git add imagenes_tanda.txt
          git add -A ofertas/

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "Actualizar tanda de ofertas"
            git pull --rebase origin main
            git push origin main
          fi
