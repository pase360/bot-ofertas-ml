name: Publicar Ofertas Automaticas

permissions:
  contents: write

on:
  workflow_dispatch:

  schedule:
    # 12:30 Argentina = 15:30 UTC
    - cron: '30 15 * * *'

    # 20:30 Argentina = 23:30 UTC
    - cron: '30 23 * * *'

concurrency:
  group: publicar-ofertas-automaticas
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow cryptography

      - name: Renovar token de Mercado Libre
        env:
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_REFRESH_TOKEN_INICIAL: ${{ secrets.MELI_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import base64
          import hashlib
          import requests
          from cryptography.fernet import Fernet

          client_id = os.environ["MELI_CLIENT_ID"]
          client_secret = os.environ["MELI_CLIENT_SECRET"]

          clave = base64.urlsafe_b64encode(
              hashlib.sha256(client_secret.encode()).digest()
          )
          fernet = Fernet(clave)

          archivo = "meli_refresh_token.enc"

          # Usa directamente el refresh token nuevo
          # guardado en GitHub Secrets.
          refresh_token = os.environ["MELI_REFRESH_TOKEN_INICIAL"]

          r = requests.post(
              "https://api.mercadolibre.com/oauth/token",
              data={
                  "grant_type": "refresh_token",
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "refresh_token": refresh_token,
              },
              timeout=30,
          )

          r.raise_for_status()
          data = r.json()

          access_token = data["access_token"]
          nuevo_refresh_token = data["refresh_token"]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("MELI_ACCESS_TOKEN=" + access_token + "\n")

          with open(archivo, "wb") as f:
              f.write(fernet.encrypt(nuevo_refresh_token.encode()))

          print("Token de Mercado Libre renovado correctamente")
          PY

      - name: Guardar inmediatamente token renovado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add meli_refresh_token.enc

          if git diff --cached --quiet; then
            echo "El token cifrado no tuvo cambios"
          else
            git commit -m "Actualizar token cifrado de Mercado Libre"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Verificar identidad del token
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["MELI_ACCESS_TOKEN"]

          r = requests.get(
              "https://api.mercadolibre.com/users/me",
              headers={"Authorization": f"Bearer {token}"},
              timeout=30,
          )

          print("STATUS:", r.status_code)

          if r.ok:
              data = r.json()
              print("USER ID:", data.get("id"))
              print("NICKNAME:", data.get("nickname"))
              print("SITE ID:", data.get("site_id"))
          else:
              print("ERROR:", r.text[:1000])

          r.raise_for_status()
          PY

      - name: Probar permiso Metricas del negocio
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["MELI_ACCESS_TOKEN"]

          r = requests.get(
              "https://api.mercadolibre.com/users/5502973/items_visits",
              headers={"Authorization": f"Bearer {token}"},
              params={
                  "date_from": "2026-09-20",
                  "date_to": "2026-09-24"
              },
              timeout=30,
          )

          print("STATUS VISITS:", r.status_code)
          print("RESPUESTA VISITS:", r.text[:1000])
          PY

      - name: Ejecutar Bot de Ofertas
        run: |
          python main.py

      - name: Guardar tanda, datos, imágenes e historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ultima_tanda.txt
          git add datos_tanda.txt
          git add imagenes_tanda.txt
          git add historial_publicados.txt
          git add -A ofertas/

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "Actualizar tanda de ofertas e historial"
            git pull --rebase origin main
            git push origin main
          fi
