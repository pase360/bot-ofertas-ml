name: Publicar Ofertas Automaticas

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow playwright

      - name: Instalar Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Ejecutar Bot de Ofertas
        run: |
          python main.py

      - name: Guardar tanda, datos e imágenes en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ultima_tanda.txt
          git add datos_tanda.txt
          git add imagenes_tanda.txt
          git add ofertas/

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "Actualizar tanda de ofertas"
            git push
          fi
