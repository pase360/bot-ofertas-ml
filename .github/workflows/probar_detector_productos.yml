name: Probar Detector de Productos

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  detectar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Ejecutar Detector de Productos
        run: |
          python detector_productos.py

      - name: Guardar productos detectados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add productos_demandados.json

          if git diff --cached --quiet; then
            echo "No hubo cambios en los productos detectados"
          else
            git commit -m "Actualizar productos demandados"
            git pull --rebase origin main
            git push origin main
          fi
