name: Obtener Token Mercado Libre

on:
  workflow_dispatch:

jobs:
  obtener-token:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener nuevo access token
        env:
          CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          r = requests.post(
              "https://api.mercadolibre.com/oauth/token",
              data={
                  "grant_type": "refresh_token",
                  "client_id": os.environ["CLIENT_ID"],
                  "client_secret": os.environ["CLIENT_SECRET"],
                  "refresh_token": os.environ["REFRESH_TOKEN"],
              },
              timeout=30,
          )

          data = r.json()

          if r.status_code != 200 or "access_token" not in data:
              print("ERROR AL RENOVAR TOKEN")
              print("HTTP:", r.status_code)
              print("error:", data.get("error", "desconocido"))
              print("message:", data.get("message", "sin detalle"))
              raise SystemExit(1)

          access = data["access_token"]
          refresh = data.get("refresh_token", "")

          # Enmascara inmediatamente ambos valores en GitHub Actions.
          print(f"::add-mask::{access}")
          if refresh:
              print(f"::add-mask::{refresh}")

          print("TOKEN RENOVADO CORRECTAMENTE")
          print("IMPORTANTE: se generó un ACCESS_TOKEN nuevo.")
          if refresh:
              print("IMPORTANTE: Mercado Libre también devolvió un REFRESH_TOKEN nuevo.")
          PY
